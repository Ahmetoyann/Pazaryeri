name: flutter_application_1
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.6
  shared_preferences: ^2.3.2
  image_picker: ^1.0.7
  confetti: ^0.7.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
